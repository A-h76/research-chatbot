{% extends "auth/base.html" %}
{% block title %}Reset password · Dhund{% endblock %}
{% block body %}
  <h1>Choose a new password</h1>
  <p class="lede">Enter and confirm your new password.</p>
  <div id="auth-msg" class="msg" role="status"></div>
  <form id="reset-form" class="stack" data-token="{{ token }}" novalidate>
    <div class="field">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="10" />
    </div>
    <div class="field">
      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required minlength="10" />
    </div>
    <button class="btn btn-primary" type="submit" id="reset-btn">Update password</button>
  </form>
{% endblock %}
