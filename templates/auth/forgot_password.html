{% extends "auth/base.html" %}
{% block title %}Forgot password · Dhund{% endblock %}
{% block body %}
  <h1>Forgot password</h1>
  <p class="lede">Enter your email and we’ll send a reset link if an account exists.</p>
  <div id="auth-msg" class="msg" role="status"></div>
  <form id="forgot-form" class="stack" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required />
    </div>
    <button class="btn btn-primary" type="submit" id="forgot-btn">Send reset link</button>
  </form>
  <p class="footer-links"><a href="/auth/sign-in">Back to sign in</a></p>
{% endblock %}
