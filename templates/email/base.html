<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>{% block title %}Dhund{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#0b1220;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e8eef7;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0b1220;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#121a2b;border:1px solid #243049;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="padding:28px 28px 8px 28px;">
              <div style="font-size:20px;font-weight:700;letter-spacing:-0.02em;color:#f4f7fb;">Dhund</div>
              <div style="margin-top:4px;font-size:12px;color:#8b9bb4;">Research Operating System</div>
            </td>
          </tr>
          <tr>
            <td style="padding:12px 28px 28px 28px;font-size:15px;line-height:1.55;color:#d5deeb;">
              {% block content %}{% endblock %}
            </td>
          </tr>
        </table>
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;margin-top:20px;">
          <tr>
            <td align="center" style="font-size:12px;line-height:1.6;color:#7a8aa3;">
              Need help?<br />
              <a href="mailto:{{ support_email }}" style="color:#14b8a6;text-decoration:none;">{{ support_email }}</a>
              &nbsp;·&nbsp;
              <a href="{{ site_url }}" style="color:#14b8a6;text-decoration:none;">{{ site_url }}</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
