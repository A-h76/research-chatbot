<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Dhund — Research Operating System{% endblock %}</title>
<meta name="description" content="{% block description %}Build trustworthy research—from evidence to publication.{% endblock %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');</script>
<style>
  :root {
    --ink: #14201f;
    --muted: #5a6b69;
    --line: rgba(15, 110, 106, 0.14);
    --teal: #0f6e6a;
    --teal-deep: #0a524f;
    --teal-soft: #e6f3f2;
    --surface: #f7faf9;
    --paper: #ffffff;
    --ok: #1f6b4a;
    --danger: #9b2c2c;
    --radius: 14px;
    --shadow: 0 18px 50px rgba(20, 32, 31, 0.08);
    --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 12% -10%, rgba(15, 110, 106, 0.12), transparent 55%),
      radial-gradient(900px 500px at 88% 8%, rgba(15, 110, 106, 0.08), transparent 50%),
      linear-gradient(180deg, #f4f8f7 0%, var(--surface) 38%, #f9fbfa 100%);
    min-height: 100vh;
    line-height: 1.55;
  }
  a { color: inherit; text-decoration: none; }
  button, input, textarea { font: inherit; }
  .wrap { width: min(1120px, calc(100% - 2.5rem)); margin-inline: auto; }
  .wrap-narrow { width: min(760px, calc(100% - 2.5rem)); margin-inline: auto; }

  .nav {
    position: sticky; top: 0; z-index: 40;
    backdrop-filter: blur(12px);
    background: rgba(247, 250, 249, 0.85);
    border-bottom: 1px solid transparent;
    transition: border-color .2s ease;
  }
  .nav.is-scrolled { border-bottom-color: var(--line); }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; padding: 0.9rem 0;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 0.55rem;
    font-weight: 700; letter-spacing: -0.03em; font-size: 1.05rem;
  }
  .brand-mark {
    width: 1.7rem; height: 1.7rem; border-radius: 0.45rem;
    background: var(--teal); color: #fff; display: grid; place-items: center;
    font-size: 0.68rem; font-weight: 700;
  }
  .nav-links {
    display: flex; align-items: center; gap: 0.25rem;
    padding: 0.25rem; border-radius: 999px;
    background: rgba(255,255,255,0.65); border: 1px solid var(--line);
  }
  .nav-links a {
    padding: 0.45rem 0.8rem; border-radius: 999px;
    font-size: 0.84rem; font-weight: 500; color: var(--muted);
    transition: background .18s ease, color .18s ease;
  }
  .nav-links a:hover, .nav-links a.is-active {
    background: var(--teal-soft); color: var(--teal-deep);
  }
  .nav-actions { display: flex; align-items: center; gap: 0.5rem; }
  .nav-cta, .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
    border: none; border-radius: 999px; padding: 0.55rem 1rem;
    font-size: 0.86rem; font-weight: 600; cursor: pointer;
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .nav-cta, .btn-primary {
    background: var(--teal); color: #fff;
    box-shadow: 0 8px 22px rgba(15, 110, 106, 0.22);
  }
  .nav-cta:hover, .btn-primary:hover { background: var(--teal-deep); transform: scale(1.03); }
  .btn { padding: 0.85rem 1.35rem; font-size: 0.95rem; }
  .btn-ghost {
    background: rgba(255,255,255,0.7); color: var(--ink); border: 1px solid var(--line);
  }
  .btn-ghost:hover { background: #fff; transform: scale(1.03); }
  .nav-signin {
    padding: 0.45rem 0.85rem; border-radius: 999px;
    font-size: 0.84rem; font-weight: 600; color: var(--teal-deep);
  }
  .nav-signin:hover { background: var(--teal-soft); }

  .page { padding: 2.5rem 0 4rem; }
  .page-hero { padding: 2.2rem 0 1.5rem; max-width: 42rem; }
  .page-hero h1 {
    font-size: clamp(2rem, 4vw, 3rem); line-height: 1.08;
    letter-spacing: -0.035em; font-weight: 700; margin-bottom: 0.75rem;
  }
  .page-hero .support {
    font-family: var(--serif); font-style: italic;
    font-size: clamp(1.15rem, 2vw, 1.45rem); color: var(--muted); margin-bottom: 0.85rem;
  }
  .page-hero .lead { color: var(--muted); font-size: 1.05rem; max-width: 40ch; }
  .eyebrow {
    display: inline-flex; font-size: 0.78rem; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--teal);
    margin-bottom: 0.85rem;
  }

  section.block { padding: 2.75rem 0; }
  .section-head { max-width: 40rem; margin-bottom: 1.75rem; }
  .section-head h2 {
    font-size: clamp(1.45rem, 2.4vw, 2rem); letter-spacing: -0.03em;
    line-height: 1.15; margin-bottom: 0.5rem;
  }
  .section-head p { color: var(--muted); }
  .serif { font-family: var(--serif); font-style: italic; color: var(--muted); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 1.25rem 1.2rem; transition: transform .2s ease, box-shadow .2s ease;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 16px 36px rgba(20, 32, 31, 0.08); }
  .card h3 { font-size: 1.05rem; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
  .card p, .card li { color: var(--muted); font-size: 0.92rem; }
  .card-icon {
    width: 2.1rem; height: 2.1rem; border-radius: 0.55rem; display: grid; place-items: center;
    background: var(--teal-soft); color: var(--teal-deep); margin-bottom: 0.85rem; font-weight: 700; font-size: 0.85rem;
  }

  .flow {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.55rem;
  }
  .flow-step {
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
    padding: 1rem 0.8rem; text-align: center;
  }
  .flow-step strong { display: block; font-size: 0.88rem; margin-bottom: 0.2rem; letter-spacing: -0.01em; }
  .flow-step span { display: block; font-size: 0.76rem; color: var(--muted); }
  .flow-vertical { display: grid; gap: 0; max-width: 520px; }
  .flow-v-step {
    display: grid; grid-template-columns: 2rem 1fr; gap: 0.85rem; align-items: start;
  }
  .flow-v-rail {
    display: flex; flex-direction: column; align-items: center;
  }
  .flow-v-dot {
    width: 0.85rem; height: 0.85rem; border-radius: 50%;
    background: var(--teal); margin-top: 0.35rem; flex-shrink: 0;
  }
  .flow-v-line {
    width: 2px; flex: 1; min-height: 1.4rem; background: rgba(15, 110, 106, 0.25);
  }
  .flow-v-body {
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
    padding: 1rem 1.1rem; margin-bottom: 0.75rem;
  }
  .flow-v-body h3 { font-size: 1rem; margin-bottom: 0.3rem; letter-spacing: -0.015em; }
  .flow-v-body p { color: var(--muted); font-size: 0.92rem; }

  .panel {
    background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
    padding: 1.6rem 1.5rem; box-shadow: var(--shadow);
  }
  .panel h2 { font-size: 1.35rem; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
  .panel .sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.1rem; }

  .mock {
    border-radius: 22px; background: linear-gradient(165deg, #fff 0%, #f3f8f7 100%);
    border: 1px solid var(--line); box-shadow: var(--shadow); padding: 1.25rem 1.3rem;
  }
  .mock-kicker {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); font-weight: 600;
  }
  .mock-title { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em; margin: 0.15rem 0 0.85rem; }
  .mock-list { list-style: none; display: grid; gap: 0.4rem; }
  .mock-list li { display: flex; gap: 0.45rem; font-size: 0.88rem; }
  .tick { color: var(--teal); font-weight: 700; }

  /* Research OS beam diagram — calm teal flow (landing hero) */
  .ros-flow {
    position: relative; border-radius: 22px;
    background: linear-gradient(165deg, #fff 0%, #f3f8f7 100%);
    border: 1px solid var(--line); box-shadow: var(--shadow);
    padding: 1.15rem 1rem 1rem; overflow: hidden; min-height: 292px;
  }
  .ros-flow-kicker {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--teal); font-weight: 700; margin-bottom: 0.85rem; position: relative; z-index: 2;
  }
  .ros-row {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 0.4rem;
    position: relative; z-index: 2;
  }
  .ros-node {
    min-width: 4.5rem; padding: 0.42rem 0.5rem; border-radius: 10px;
    border: 1px solid var(--line); background: #fff; text-align: center;
    font-size: 0.7rem; font-weight: 650; color: var(--ink);
  }
  .ros-node small {
    display: block; font-size: 0.6rem; font-weight: 500; color: var(--muted); margin-top: 0.12rem;
  }
  .ros-core {
    margin: 0.95rem auto; width: fit-content; padding: 0.65rem 1rem;
    border-radius: 12px; border: 1px solid rgba(15,110,106,0.35);
    background: var(--teal-soft); color: var(--teal-deep);
    font-weight: 700; font-size: 0.86rem; position: relative; z-index: 2; text-align: center;
  }
  .ros-core small { display: block; font-weight: 500; font-size: 0.66rem; opacity: 0.85; margin-top: 0.1rem; }
  .ros-caption {
    margin-top: 0.75rem; text-align: center; font-size: 0.74rem; color: var(--muted);
    position: relative; z-index: 2; max-width: 28ch; margin-inline: auto;
  }
  .ros-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .ros-path { fill: none; stroke: rgba(15,110,106,0.16); stroke-width: 1.5; }
  .ros-beam {
    fill: none; stroke: url(#rosGrad); stroke-width: 2; stroke-linecap: round;
    stroke-dasharray: 12 110; animation: rosBeam 3.6s ease-in-out infinite;
  }
  @keyframes rosBeam {
    0% { stroke-dashoffset: 130; }
    100% { stroke-dashoffset: -130; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ros-beam { animation: none; stroke-dasharray: none; opacity: 0.5; }
  }

  .prose h2 {
    font-size: 1.35rem; letter-spacing: -0.02em; margin: 2rem 0 0.65rem;
  }
  .prose h3 { font-size: 1.08rem; margin: 1.4rem 0 0.45rem; }
  .prose p { color: var(--muted); margin-bottom: 0.9rem; }
  .prose ul { margin: 0 0 1rem 1.15rem; color: var(--muted); }
  .prose li { margin-bottom: 0.35rem; }
  .prose a { color: var(--teal-deep); text-decoration: underline; text-underline-offset: 2px; }

  .cta-band {
    margin-top: 2rem; padding: 1.5rem 1.4rem; border-radius: 16px;
    background: linear-gradient(160deg, #0f6e6a 0%, #0a524f 100%); color: #f4fffd;
    display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between;
  }
  .cta-band p { color: rgba(255,255,255,0.88); max-width: 36rem; }
  .cta-band .btn-primary { background: #fff; color: var(--teal-deep); box-shadow: none; }
  .cta-band .btn-primary:hover { background: var(--teal-soft); }

  .field { margin-bottom: 0.85rem; text-align: left; }
  .field label {
    display: block; font-size: 0.82rem; font-weight: 600; color: var(--muted); margin-bottom: 0.35rem;
  }
  .field input, .field textarea {
    width: 100%; border: 1px solid var(--line); background: #fbfcfc;
    border-radius: 10px; padding: 0.75rem 0.85rem; color: var(--ink);
  }
  .field input:focus, .field textarea:focus {
    outline: 2px solid rgba(15, 110, 106, 0.25); border-color: var(--teal);
  }
  .field textarea { min-height: 110px; resize: vertical; }
  .access-btn, .magic-btn {
    width: 100%; border: none; border-radius: 10px; padding: 0.8rem 1rem;
    background: var(--teal); color: #fff; font-weight: 600; cursor: pointer;
    transition: background .15s, transform .18s, opacity .15s;
  }
  .access-btn:hover, .magic-btn:hover { background: var(--teal-deep); transform: scale(1.02); }
  .access-btn:disabled, .magic-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

  .beta-note {
    background: var(--teal-soft); border: 1px solid rgba(15, 110, 106, 0.2);
    color: var(--teal-deep); padding: 0.85rem 1rem; border-radius: 10px;
    margin-bottom: 1rem; font-size: 0.88rem;
  }
  .beta-note a { color: var(--teal-deep); text-decoration: underline; text-underline-offset: 2px; }
  .err {
    background: #fdf2f2; border: 1px solid #f0c4c4; color: var(--danger);
    padding: 0.85rem 1rem; border-radius: 10px; margin-bottom: 1rem; font-size: 0.88rem;
  }
  .ok {
    background: #eef8f2; border: 1px solid #c6e6d3; color: var(--ok);
    padding: 0.85rem 1rem; border-radius: 10px; margin-bottom: 1rem; font-size: 0.88rem;
  }
  .gbtn {
    display: inline-flex; align-items: center; gap: 0.7rem; background: #fff; color: #1f1f1f;
    border: 1px solid var(--line); border-radius: 12px; padding: 0.85rem 1.1rem;
    font-size: 0.95rem; font-weight: 600; width: 100%; justify-content: center;
    transition: background .15s, transform .18s;
  }
  .gbtn:hover { background: #f7faf9; transform: scale(1.01); }
  .gbtn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .or {
    display: flex; align-items: center; gap: 0.75rem; margin: 1rem 0;
    color: #8a9a97; font-size: 0.78rem;
  }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .setup-box {
    background: #f4f8f7; border: 1px solid var(--line); border-radius: 12px;
    padding: 1rem 1.1rem; text-align: left;
  }
  .setup-box h3 { font-size: 0.95rem; margin-bottom: 0.75rem; }
  .step { display: flex; gap: 0.6rem; align-items: flex-start; margin-bottom: 0.65rem; font-size: 0.86rem; color: var(--muted); }
  .step-num {
    flex-shrink: 0; width: 1.25rem; height: 1.25rem; border-radius: 50%;
    background: var(--teal-soft); color: var(--teal-deep); display: grid; place-items: center;
    font-size: 0.7rem; font-weight: 700; margin-top: 0.1rem;
  }
  code {
    background: #eef3f1; border: 1px solid var(--line); border-radius: 5px;
    padding: 0.05rem 0.35rem; font-family: ui-monospace, monospace; font-size: 0.78rem; color: var(--teal-deep);
  }
  .dev-btn {
    display: block; width: 100%; padding: 0.75rem; background: transparent;
    border: 1px dashed rgba(15, 110, 106, 0.35); border-radius: 12px;
    color: var(--muted); font-size: 0.88rem; text-align: center;
  }
  .dev-btn:hover { border-color: var(--teal); color: var(--teal-deep); }
  .expect-list { list-style: none; display: grid; gap: 0.55rem; margin: 1rem 0 1.4rem; }
  .expect-list li {
    display: flex; gap: 0.5rem; align-items: center;
    padding: 0.65rem 0.8rem; border-radius: 10px; background: var(--teal-soft);
    color: var(--teal-deep); font-weight: 500; font-size: 0.92rem;
  }

  footer {
    padding: 2.25rem 0 2.75rem; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 0.86rem;
  }
  .footer-inner {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; align-items: center;
  }
  .footer-links { display: flex; gap: 1rem; flex-wrap: wrap; }
  .footer-links a:hover { color: var(--teal-deep); }

  /* Progressive enhancement: visible by default; JS may soften entrance */
  .reveal { opacity: 1; transform: none; transition: opacity .45s ease, transform .45s ease; }
  html.js:not(.reduce-motion) .js-animate .reveal:not(.in) {
    opacity: 0; transform: translateY(10px);
  }
  html.js:not(.reduce-motion) .js-animate .reveal.in {
    opacity: 1; transform: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .btn:hover, .nav-cta:hover, .card:hover { transform: none; }
    .reveal { transition: none !important; opacity: 1 !important; transform: none !important; }
  }

  .auth-shell {
    min-height: calc(100vh - 8rem);
    display: grid; place-items: center; padding: 2rem 0 3rem;
  }
  .auth-card { width: min(420px, 100%); text-align: center; }

  .hero-grid {
    display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 2.5rem; align-items: center;
    padding: 2.5rem 0 3.5rem;
  }
  .hero-grid h1 {
    font-size: clamp(2.15rem, 4.2vw, 3.25rem); line-height: 1.08;
    letter-spacing: -0.035em; font-weight: 700; margin-bottom: 1rem; max-width: 14ch;
  }
  .pipeline-strip {
    margin-top: 1.5rem; display: flex; flex-wrap: wrap; align-items: center;
    gap: 0.4rem 0.5rem; font-size: 0.78rem; font-weight: 600; color: var(--muted);
  }
  .pipeline-strip .step {
    padding: 0.28rem 0.55rem; border-radius: 999px; background: rgba(255,255,255,0.75);
    border: 1px solid var(--line); color: var(--ink);
  }
  .pipeline-strip .arrow { opacity: 0.45; }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.25rem; }

  @media (max-width: 960px) {
    .nav-links { display: none; }
    .hero-grid { grid-template-columns: 1fr; }
    .hero-grid h1 { max-width: none; }
    .flow { grid-template-columns: 1fr 1fr 1fr; }
  }
  @media (max-width: 640px) {
    .wrap, .wrap-narrow { width: min(100% - 1.5rem, 1120px); }
    .flow { grid-template-columns: 1fr; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
  <header class="nav" id="top-nav">
    <div class="wrap nav-inner">
      <a class="brand" href="{{ url_for('root') }}" aria-label="Dhund home">
        <span class="brand-mark" aria-hidden="true">Dh</span>
        Dhund
      </a>
      <nav class="nav-links" aria-label="Primary">
        <a href="{{ url_for('marketing_product') }}" class="{{ 'is-active' if active == 'product' else '' }}">Product</a>
        <a href="{{ url_for('marketing_how_it_works') }}" class="{{ 'is-active' if active == 'how' else '' }}">How it Works</a>
        <a href="{{ url_for('marketing_research') }}" class="{{ 'is-active' if active == 'research' else '' }}">Research</a>
        <a href="{{ url_for('marketing_pricing') }}" class="{{ 'is-active' if active == 'pricing' else '' }}">Pricing</a>
      </nav>
      <div class="nav-actions">
        <a class="nav-signin" href="/auth/sign-in">Sign In</a>
        <a class="nav-cta" href="/auth/sign-up">Get started</a>
      </div>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="wrap footer-inner">
      <p>© Dhund · Research Operating System</p>
      <div class="footer-links">
        <a href="{{ url_for('marketing_product') }}">Product</a>
        <a href="{{ url_for('marketing_how_it_works') }}">How it Works</a>
        <a href="{{ url_for('marketing_research') }}">Research</a>
        <a href="/auth/sign-up">Get started</a>
        <a href="/auth/sign-in">Sign In</a>
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) document.documentElement.classList.add('reduce-motion');

      var nav = document.getElementById('top-nav');
      function onScroll() {
        if (nav) nav.classList.toggle('is-scrolled', window.scrollY > 8);
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      /* Progressive enhancement: only hide-for-animate after observer is ready */
      var nodes = document.querySelectorAll('.reveal');
      if (!reduce && 'IntersectionObserver' in window && nodes.length) {
        document.body.classList.add('js-animate');
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) e.target.classList.add('in');
          });
        }, { threshold: 0.12, rootMargin: '0px 0px -32px 0px' });
        nodes.forEach(function (el) { io.observe(el); });
        /* Hash targets must never stay blank */
        if (location.hash) {
          var target = document.querySelector(location.hash);
          if (target) {
            target.classList.add('in');
            target.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); });
          }
        }
      } else {
        nodes.forEach(function (el) { el.classList.add('in'); });
      }
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
